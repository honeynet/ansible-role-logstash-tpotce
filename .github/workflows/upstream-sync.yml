---
name: Upstream sync check
'on':
  schedule:
    - cron: "0 6 * * 1"  # weekly, Monday
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    name: Check geerlingguy/ansible-role-logstash for changes
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4
        with:
          path: logstash

      - name: Check out upstream geerlingguy/ansible-role-logstash
        uses: actions/checkout@v4
        with:
          repository: geerlingguy/ansible-role-logstash
          path: upstream

      # tasks/ssl.yml and tasks/plugins.yml are kept byte-for-byte identical
      # to upstream (see README.md's Provenance section), so it's safe to
      # copy an upstream change straight in. handlers/main.yml takes its
      # structure from upstream but has been adapted (ansible.builtin.systemd
      # with daemon_reload instead of the free-form service: module), so an
      # upstream change there is only ever flagged for a human to look at,
      # never applied automatically.
      - name: Compare tracked files against upstream
        id: diff
        working-directory: logstash
        run: |
          set -euo pipefail
          changed=0
          body_file="$RUNNER_TEMP/pr-body.md"
          : > "$body_file"

          for f in tasks/ssl.yml tasks/plugins.yml; do
            if ! diff -q "$f" "../upstream/$f" >/dev/null 2>&1; then
              changed=1
              {
                echo "### \`$f\` — applied (kept byte-for-byte identical to upstream)"
                echo '```diff'
                diff -u "$f" "../upstream/$f" || true
                echo '```'
                echo
              } >> "$body_file"
              cp "../upstream/$f" "$f"
            fi
          done

          for f in handlers/main.yml; do
            if ! diff -q "$f" "../upstream/$f" >/dev/null 2>&1; then
              changed=1
              {
                echo "### \`$f\` — NOT applied (this file has local changes; review manually)"
                echo '```diff'
                diff -u "$f" "../upstream/$f" || true
                echo '```'
                echo
              } >> "$body_file"
            fi
          done

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Open or update a PR with the upstream changes
        if: steps.diff.outputs.changed == '1'
        working-directory: logstash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          upstream_sha=$(git -C ../upstream rev-parse --short HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b upstream-sync
          git add -A
          git commit -m "Upstream check: geerlingguy/ansible-role-logstash@${upstream_sha}" --allow-empty
          git push -u origin upstream-sync --force
          if ! gh pr list --head upstream-sync --state open --json number --jq '.[0]' | grep -q .; then
            gh pr create \
              --title "Upstream check: geerlingguy/ansible-role-logstash@${upstream_sha}" \
              --body-file "$RUNNER_TEMP/pr-body.md" \
              --base master --head upstream-sync
          else
            gh pr edit upstream-sync --body-file "$RUNNER_TEMP/pr-body.md"
          fi
