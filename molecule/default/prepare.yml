---
- name: Prepare
  hosts: all
  become: true
  gather_facts: true

  # Empty on a normal machine. Inherited by every task, including the role's,
  # so apt, get_url and logstash-plugin all work from behind a proxy.
  environment:
    http_proxy: "{{ lookup('ansible.builtin.env', 'http_proxy') }}"
    https_proxy: "{{ lookup('ansible.builtin.env', 'https_proxy') }}"
    no_proxy: "{{ lookup('ansible.builtin.env', 'no_proxy') }}"

  tasks:
    # No-op unless MOLECULE_PROXY_CA_FILE points at a CA bundle, which is only
    # needed where TLS is terminated by an intercepting proxy.
    - name: Trust an additional CA certificate when one is supplied.
      when: (lookup('ansible.builtin.env', 'MOLECULE_PROXY_CA_FILE') | default('', true)) | length > 0
      block:
        - name: Install the supplied CA certificate.
          ansible.builtin.copy:
            src: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROXY_CA_FILE') }}"
            dest: /usr/local/share/ca-certificates/molecule-proxy-ca.crt
            owner: root
            group: root
            mode: '0644'

        - name: Rebuild the CA trust store.
          ansible.builtin.command:
            cmd: update-ca-certificates
          changed_when: true

    - name: Point apt at the proxy when one is configured.
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/99molecule-proxy
        owner: root
        group: root
        mode: '0644'
        content: |
          Acquire::http::Proxy "{{ lookup('ansible.builtin.env', 'http_proxy') }}";
          Acquire::https::Proxy "{{ lookup('ansible.builtin.env', 'https_proxy') }}";
      when: (lookup('ansible.builtin.env', 'https_proxy') | default('', true)) | length > 0

    - name: Update the apt cache.
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
