# Filter Ddospot messages from filebeat
#
# T-Pot's own pipeline derives dest_port from the source log file name
# (chargenpot/dnspot/ntpot/ssdpot). That path is not available here, because the
# events arrive over beats rather than being tailed off local disk, so the port
# is left to whatever the honeypot itself reports.
filter {
  if "ddospot" in [tags] {
    json {
      source => "message"
    }
    date {
      match => [ "time", "yyyy-MM-dd HH:mm:ss.SSSSSS" ]
      remove_field => ["time"]
    }
    mutate {
      copy => { "MY_EXTIP" => "dest_ip" }
    }
  }
}
