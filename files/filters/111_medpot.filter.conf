# Filter Medpot messages from filebeat
filter {
  if "medpot" in [tags] {
    json {
      source => "message"
    }
    mutate {
      add_field => {
        "dest_port" => "2575"
      }
      copy => { "MY_EXTIP" => "dest_ip" }
    }
    date {
      match => [ "timestamp", "ISO8601" ]
    }
  }
}
