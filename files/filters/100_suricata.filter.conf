# Filter Suricata messages from filebeat
filter {
  if "suricata" in [tags] {
    json {
      source => "message"
    }
    date {
      match => [ "timestamp", "ISO8601" ]
    }
    # logstash-filter-translate 4.0 renamed "field" to "source" and
    # "destination" to "target". The old names are removed, not deprecated.
    translate {
      refresh_interval => 86400
      source => "[alert][signature_id]"
      target => "[alert][cve_id]"
      dictionary_path => "/etc/listbot/cve.yaml"
    }
  }
}
