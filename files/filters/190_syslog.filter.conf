# Filter syslog messages from filebeat
filter {
  if "syslog_filebeat" in [tags] {
    grok {
      match => ["message", "%{SYSLOGBASE} %{GREEDYDATA:message}"]
      remove_tag => ["beats_input_codec_plain_applied"]
      remove_field => ["offset"]
      overwrite => ["message"]
    }
    date {
      match => ["timestamp", "MMM  dd HH:mm:ss", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss", "MMM d HH:mm:ss"]
      remove_field => ["timestamp"]
    }
  }
}
