# Filter Ciscoasa messages from filebeat
filter {
  if "Ciscoasa" in [tags] {
    kv {
      remove_char_key => " '{}"
      remove_char_value => "'{}"
      value_split => ":"
      field_split => ","
    }
    date {
      match => [ "timestamp", "ISO8601" ]
    }
    mutate {
      copy => { "MY_EXTIP" => "dest_ip" }
    }
  }
}
