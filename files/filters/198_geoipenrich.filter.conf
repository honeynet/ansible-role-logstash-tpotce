# Add geo coordinates / ASN info / IP rep.
#
# The geoip filter bundles Creative Commons GeoLite2 City and ASN databases and
# picks between them with default_database_type. Older revisions of this file
# pointed "database" at a path under /usr/share/logstash/vendor/bundle/jruby/,
# which no longer exists: 8.x moved database handling into the GeoIP database
# management service. T-Pot made the same change upstream.
filter {
  if [src_ip] {
    geoip {
      cache_size => 10000
      source => "src_ip"
      default_database_type => "City"
    }
    geoip {
      cache_size => 10000
      source => "src_ip"
      default_database_type => "ASN"
    }
    # logstash-filter-translate 4.0 renamed "field" to "source" and
    # "destination" to "target". The old names are removed, not deprecated.
    translate {
      refresh_interval => 86400
      source => "src_ip"
      target => "ip_rep"
      dictionary_path => "/etc/listbot/iprep.yaml"
    }
  }
}
