# Filter Hellpot messages from filebeat
filter {
  if "hellpot" in [tags] {
    json {
      source => "message"
    }
    date {
      match => [ "time", "ISO8601" ]
      remove_field => ["time"]
      remove_field => ["timestamp"]
    }
    mutate {
      add_field => {
        "dest_port" => "80"
      }
      copy => { "MY_EXTIP" => "dest_ip" }
      rename => {
        "BYTES" => "bytes"
        "DURATION" => "duration"
        "REMOTE_ADDR" => "src_ip"
        "URL" => "url"
        "USERAGENT" => "http_user_agent"
        "message" => "reason"
      }
    }
  }
}
