# Filter Ipphoney messages from filebeat
filter {
  if "ipphoney" in [tags] {
    date {
      match => [ "timestamp", "ISO8601" ]
    }
    mutate {
      rename => {
        "query" => "ipp_query"
        "content_type" => "http.http_content_type"
        "dst_port" => "dest_port"
        "dst_ip" => "dest_ip"
        "request" => "request_method"
        "operation" => "data"
        "user_agent" => "http_user_agent"
        "url" => "http.url"
      }
    }   
  }
}
