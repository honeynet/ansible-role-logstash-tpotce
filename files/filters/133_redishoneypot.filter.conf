# Filter Redishoneypot messages from filebeat
filter {
  if "redishoneypot" in [tags] {
    json {
      source => "message"
    }
    date {
      match => [ "time", "yyyy-MM-dd HH:mm:ss" ]
      remove_field => ["time"]
      remove_field => ["timestamp"]
    }
    mutate {
      split => { "addr" => ":" }
      add_field => {
        "src_ip" => "%{[addr][0]}"
        "src_port" => "%{[addr][1]}"
        "dest_port" => "6379"
      }
      remove_field => ["addr"]
    }
    mutate {
      copy => { "MY_EXTIP" => "dest_ip" }
    }
  }
}
