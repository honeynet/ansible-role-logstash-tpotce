# Filter RDPHoneypot messages from filebeat
filter {
  if "rdphoneypot" in [tags] {
    json {
      source => "message"
    }
    mutate {
      gsub => [
        "timestamp", "\+00:00Z$", "+00:00"
      ]
    }
    date {
      match => [ "timestamp", "ISO8601" ]
    }
    mutate {
      rename => {
        "dst_port" => "dest_port"
        "dst_ip" => "dest_ip"
      }
    }
  }
}
