# Filter Go-pot messages from filebeat
filter {
  if "go-pot" in [tags] {
    json {
      source => "message"
    }
    if ! [dest_port] {
      drop {}
    }
    date {
      match => [ "timestamp", "ISO8601" ]
    }
    mutate {
      remove_field => ["ts"]
      rename => {
        "duration" => "session_duration"
      }
    }
  }
}
